backend:
  name: github
  repo: YOUR_USERNAME/YOUR_REPO
  branch: main

# This makes uploaded product photos land in /images and be referenced
# with a path the site can load directly.
media_folder: "images"
public_folder: "images"

# "Editorial workflow" adds a draft/review step before changes go live.
# Remove this line if you want edits to publish to the live site instantly.
publish_mode: editorial_workflow

collections:
  - name: "products"
    label: "Shop / Products"
    files:
      - name: "catalog"
        label: "Product Catalog"
        file: "data/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — ${{fields.price}}"
            fields:
              - { label: "ID (no spaces, must be unique)", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (USD)", name: "price", widget: "number", value_type: "float" }
              - { label: "Fabric", name: "fabric", widget: "string" }
              - { label: "Personality tagline", name: "personality", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Stock (how many you have made)", name: "stock", widget: "number", value_type: "int" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Stripe Payment Link (optional, used only if you skip the cart)", name: "stripeLink", widget: "string", required: false }
