backend:
  name: github
  repo: vivaanbajaj11/vayan
  branch: main

# Uploaded product photos land at the repo root, matching the flat site structure.
media_folder: ""
public_folder: "/"

publish_mode: editorial_workflow

collections:
  - name: "products"
    label: "Shop / Products"
    files:
      - name: "catalog"
        label: "Product Catalog"
        file: "products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — ${{fields.price}}"
            fields:
              - { label: "ID (no spaces, must be unique)", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (USD)", name: "price", widget: "number", value_type: "float" }
              - { label: "Fabric", name: "fabric", widget: "string" }
              - { label: "Personality tagline", name: "personality", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Stock (how many you have made)", name: "stock", widget: "number", value_type: "int" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Stripe Payment Link (optional, used only if you skip the cart)", name: "stripeLink", widget: "string", required: false }
